[package]
name = "lvpm"
version = "0.1.0"
edition = "2024"
description = "Open-source package manager for LabVIEW (.vip) packages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/novatron-fusion/lvpm"
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
md-5 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = "8.6.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

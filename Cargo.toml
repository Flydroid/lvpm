[workspace]
members = ["crates/lvpm-core"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThatsTheEnd/lvpm"

[package]
name = "lvpm"
version.workspace = true
edition.workspace = true
description = "Open-source package manager for LabVIEW (.vip) packages"
license.workspace = true
repository.workspace = true

[dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
lvpm-core = { path = "crates/lvpm-core" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
cucumber = "0.23.0"
futures = "0.3.34"
md-5 = "0.11.0"
regex = "1.13.1"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = { version = "1.1.5", features = ["preserve_order"] }
zip = "8.6.0"

[[test]]
name = "acceptance"
harness = false

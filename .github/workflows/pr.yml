name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # rustup ships on both runner images; no third-party action to pin.
      # core_io.rs runs clippy as part of the suite.
      - name: Install Rust stable with clippy
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
        shell: bash
      # tests/workspace.rs runs `cargo metadata --offline`, which needs every
      # package already downloaded.
      - name: cargo fetch
        run: cargo fetch --locked
        shell: bash
      - name: cargo test
        run: |
          # --no-fail-fast: one run reports every failing test binary, not just the first.
          echo "::group::cargo test --workspace --locked --no-fail-fast"
          cargo test --workspace --locked --no-fail-fast
          echo "::endgroup::"
        shell: bash
      # smoke.test.sh runs in lint; its Windows twin needs Windows PowerShell.
      - name: Self-test the Windows smoke flow
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/smoke.test.ps1

  # The same build and packaging main releases with.
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      acceptance: true

  package:
    needs: [build]
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  # The CLI smoke flow inside NI's LabVIEW images, with the binary build made.
  # Steps branch on row fields (os), never on image names, so a new image is
  # one new row.
  e2e:
    name: e2e (${{ matrix.os }} ${{ matrix.year }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, year: 2025, image: "nationalinstruments/labview:2025q3patch1-linux" }
          - { os: linux, runner: ubuntu-latest, year: 2026, image: "nationalinstruments/labview:2026q3-linux" }
          # Process isolation needs the host's Windows build: ltsc2022 = windows-2022.
          - { os: windows, runner: windows-2022, year: 2026, image: "nationalinstruments/labview:2026q3-windows", acceptance: true }
    env:
      IMAGE: ${{ matrix.image }}
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lvpm-${{ matrix.os }}
          path: bin
      - name: Check disk space for the image
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # The Windows image unpacks to about 20 GB.
          $free = [int]((Get-PSDrive C).Free / 1GB)
          "C: has $free GB free"
          if ($free -lt 25) { "::error::infrastructure: $free GB free, need 25"; exit 1 }
      # The windows-2022 image ships Docker with its service stopped.
      - name: Start the Docker engine
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Start-Service docker
          docker version
      - name: Pull ${{ matrix.image }}
        shell: bash
        timeout-minutes: 50
        run: |
          for i in 1 2 3; do
            docker pull "$IMAGE" && exit 0
            [ $i = 3 ] || sleep 30
          done
          echo "::error::infrastructure: image could not be pulled: $IMAGE"; exit 1
      # The step summary is written to a mounted directory and copied out
      # afterwards: Windows containers cannot bind-mount a single file.
      - name: Smoke flow
        if: matrix.os == 'linux'
        shell: bash
        run: |
          chmod +x bin/lvpm; mkdir -p out
          docker run --rm --entrypoint bash -e GITHUB_STEP_SUMMARY=/out/summary.md \
            -v "$PWD/bin:/lvpm:ro" -v "$PWD/ci/e2e:/e2e:ro" -v "$PWD/out:/out" \
            "$IMAGE" /e2e/smoke.sh /lvpm/lvpm /e2e/fixture "$YEAR"
      - name: Smoke flow
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          docker run --rm --isolation=process --entrypoint powershell -e GITHUB_STEP_SUMMARY=C:\out\summary.md `
            -v "${PWD}\bin:C:\lvpm:ro" -v "${PWD}\ci\e2e:C:\e2e:ro" -v "${PWD}\out:C:\out" `
            $env:IMAGE -NoProfile -ExecutionPolicy Bypass -File C:\e2e\smoke.ps1 C:\lvpm\lvpm.exe C:\e2e\fixture $env:YEAR
          exit $LASTEXITCODE
      - uses: actions/download-artifact@v4
        if: matrix.acceptance
        with:
          name: lvpm-acceptance
          path: C:\src\lvpm
      - name: The @labview acceptance scenarios
        if: matrix.acceptance
        shell: pwsh
        # A run that records missing recordings runs the scenarios twice.
        timeout-minutes: 45
        run: ci/e2e/labview-acceptance.ps1 -Image $env:IMAGE -Year $env:YEAR
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.acceptance
        with:
          name: golden-${{ matrix.os }}-${{ matrix.year }}
          path: out/golden
          if-no-files-found: ignore
          retention-days: 7
      - name: Copy the e2e summary
        if: always()
        shell: bash
        run: '[ ! -f out/summary.md ] || cat out/summary.md >> "$GITHUB_STEP_SUMMARY"'

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Lint checks and self-tests
        run: |
          # Every check against the real files, then every self-test, each once.
          status=0
          for f in ci/lint/*.sh; do
            [[ "$f" == *.test.sh ]] && continue
            echo "::group::$f"; bash "$f" || status=1; echo "::endgroup::"
          done
          for f in ci/lint/*.test.sh ci/*.test.sh ci/e2e/*.test.sh; do
            echo "::group::$f"; bash "$f" || status=1; echo "::endgroup::"
          done
          exit $status

  # Branch protection requires ci-ok and pr-title.yml's conventional title
  # (an admin sets it; see CONTRIBUTING.md). ci-ok aggregates this workflow, so
  # adding a job or a matrix row never changes the required checks; the title
  # check stays apart so a title edit does not re-run this workflow.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, build, package, e2e, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Root causes (failure, cancelled) first, then jobs skipped because of them.
          bad=$(jq -r 'to_entries | map(select(.value.result != "success")) | sort_by(.value.result == "skipped") | .[]
            | "::error::\(.key): \(if .value.result == "skipped" then "skipped (downstream)" else .value.result end)"' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
          echo "every PR job passed"

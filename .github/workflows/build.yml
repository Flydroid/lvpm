# Build and test lvpm on each platform's own runner, publish the executables,
# and run lvpm against LabVIEW for Linux in NI's container (docs/linux.md).
name: build

# Every branch, so a feature branch is tested before it is merged. Tags are
# left out.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch makes its running build moot. On main each commit
# gets a group of its own, so none is cancelled or dropped from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64-bit: the MSVC build the releases ship
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            exe: lvpm.exe

          # Linux 64-bit, static: NI's image is Ubuntu 22.04, older than the
          # runner's glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x64
            exe: lvpm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('Cargo.lock') }}

      # On the runner's own platform: Windows tests on Windows.
      - name: Unit tests
        run: cargo test --workspace

      # lvpm and the end-to-end runner (e2e/), which runs in NI's container
      # and so is static on Linux as well.
      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: lvpm-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

      - name: Upload end-to-end runner
        uses: actions/upload-artifact@v4
        with:
          name: lvpm-e2e-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lvpm-e2e${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  # Both executables in one download, named for the version and commit, to
  # hand to testers. The Linux one is a tarball: an artifact zip does not keep
  # the executable bit.
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: executables

      - name: Name them
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir dist
          cp executables/lvpm-windows-x64/lvpm.exe "dist/lvpm-$version-windows-x64.exe"
          chmod +x executables/lvpm-linux-x64/lvpm
          tar -czf "dist/lvpm-$version-linux-x64.tar.gz" -C executables/lvpm-linux-x64 lvpm
          echo "BUNDLE=lvpm-$version-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: dist/
          if-no-files-found: error

  # Both suites of the end-to-end runner in e2e/ (local packages, then LUnit
  # and G-Image from the public indexes), each in a fresh container, with the
  # same steps on each platform: only the runner and the image differ.
  #
  # Windows runs on windows-2022, not windows-latest: the image is built on
  # Server 2022 (10.0.20348) and runs there with process isolation; Server
  # 2025 would need Hyper-V. Pulling it is most of that job, 10 to 16 minutes
  # for 19.7 GB on disk, so a push to a branch other than main leaves Windows
  # out: it runs on pull requests, on main, and by hand. (A job's `if` cannot
  # see the matrix, hence the list built here.)
  e2e:
    name: e2e (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main') && '["linux-x64", "windows-x64"]' || '["linux-x64"]') }}
    runs-on: ${{ matrix.platform == 'windows-x64' && 'windows-2022' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # Pinned, so a new image is a change someone makes on purpose.
      IMAGE: nationalinstruments/labview:2026q3-${{ matrix.platform == 'windows-x64' && 'windows' || 'linux' }}
      LVPM: dist/lvpm${{ matrix.platform == 'windows-x64' && '.exe' || '' }}
    steps:
      - name: Download lvpm
        uses: actions/download-artifact@v4
        with:
          name: lvpm-${{ matrix.platform }}
          path: dist

      - name: Download the end-to-end runner
        uses: actions/download-artifact@v4
        with:
          name: lvpm-e2e-${{ matrix.platform }}
          path: dist

      - name: lvpm against LabVIEW 2026
        shell: bash
        run: |
          chmod +x dist/*
          dist/lvpm-e2e run --image "$IMAGE" --lvpm "$LVPM"

name: Build

# The one build definition: pr.yml and release.yml both call it, so a PR
# builds exactly what main releases.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty means the commit that triggered the run
        type: string
        default: ''
      acceptance:
        description: Also build the acceptance tests for the Windows LabVIEW container
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-2022, bin: lvpm.exe }
          # NI's LabVIEW Linux images run Ubuntu 22.04; a binary built against a
          # newer glibc than theirs may not start there.
          - { os: linux, runner: ubuntu-22.04, bin: lvpm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash
      # Keyed on the runner image, not the os: C objects in a target/ built
      # against a newer glibc do not link on an older one.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ matrix.runner }}-
      - name: cargo build --release
        run: cargo build --release --locked
        shell: bash
      - name: Check the binary runs and reports the workspace version
        run: |
          want=$(bash ci/version-check.sh --print-version)
          got=$(target/release/${{ matrix.bin }} --version)
          echo "$got"
          [[ "$got" == *"$want"* ]] || { echo "::error::lvpm --version printed '$got', expected $want"; exit 1; }
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: lvpm-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # CARGO_MANIFEST_DIR and CARGO_BIN_EXE_lvpm are fixed at compile time, so
      # the tests are built at the path the container mounts them at.
      - name: Build the acceptance tests at C:\src\lvpm
        if: inputs.acceptance && matrix.os == 'windows'
        shell: pwsh
        run: |
          robocopy . C:\src\lvpm /E /XD target .git /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          cargo test --manifest-path C:\src\lvpm\Cargo.toml --test acceptance --no-run --locked
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: inputs.acceptance && matrix.os == 'windows'
        with:
          name: lvpm-acceptance
          path: |
            C:/src/lvpm/target/debug/lvpm.exe
            C:/src/lvpm/target/debug/deps/acceptance-*.exe
            C:/src/lvpm/tests
          if-no-files-found: error
          retention-days: 7
          overwrite: true

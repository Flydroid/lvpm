[package]
name = "lvpm-tui"
version.workspace = true
edition.workspace = true
description = "Terminal user interface of lvpm, the open-source package manager for LabVIEW (.vip) packages"
license.workspace = true
repository.workspace = true
# `tests/steps.rs` is a module of the acceptance runner, not a test target.
autotests = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
lvpm-core = { path = "../lvpm-core" }
# For `Paragraph::line_count`, which stops the detail view's scroll at the end.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }

[dev-dependencies]
cucumber = "0.23.0"
futures = "0.3.34"
lvpm-testkit = { path = "../lvpm-testkit" }
tempfile = "3.27.0"

[[test]]
name = "acceptance"
harness = false

[package]
name = "lvpm-core"
version.workspace = true
edition.workspace = true
description = "Core library of lvpm, the open-source package manager for LabVIEW (.vip) packages"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
md-5 = "0.11.0"
pubgrub = "0.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "default-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = { version = "1.1.5", features = ["preserve_order"] }
toml_edit = "0.25.17"
zip = "8.6.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
winreg = "0.56.0"
